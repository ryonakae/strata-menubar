name: Release macOS

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-macos:
    name: Build notarized macOS release
    runs-on: macos-latest
    timeout-minutes: 60
    environment: release
    permissions:
      contents: write # Required to create the draft release and upload its assets.
    env:
      APPLE_SIGNING_IDENTITY: 'Developer ID Application: Ryo Nakae (ELFWBE4NMA)'
      APPLE_TEAM_ID: 'ELFWBE4NMA'
      APPLE_API_KEY: ${{ vars.APPLE_API_KEY }}
      APPLE_API_ISSUER: ${{ vars.APPLE_API_ISSUER }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # The runner context is unavailable in job-level env, so resolve
      # RUNNER_TEMP-based paths in a step instead.
      - name: Resolve signing file paths
        run: |
          {
            echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
            echo "APPLE_CERTIFICATE_PATH=$RUNNER_TEMP/strata-menubar-developer-id.p12"
            echo "BUILD_KEYCHAIN_PATH=$RUNNER_TEMP/strata-menubar-build.keychain-db"
          } >> "$GITHUB_ENV"

      - name: Validate release version
        run: |
          set -euo pipefail

          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unsupported release tag: $GITHUB_REF_NAME" >&2
            exit 1
          fi

          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PROJECT_VERSIONS="$(grep -E 'MARKETING_VERSION = ' StrataMenubar.xcodeproj/project.pbxproj \
            | sed -E 's/.*= (.*);/\1/' | sort -u)"
          if [[ "$PROJECT_VERSIONS" != "$TAG_VERSION" ]]; then
            echo "MARKETING_VERSION '$PROJECT_VERSIONS' does not match tag version '$TAG_VERSION'" >&2
            exit 1
          fi

          echo "VERSION=$TAG_VERSION" >> "$GITHUB_ENV"

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Run tests
        run: |
          xcodebuild -project StrataMenubar.xcodeproj -scheme StrataMenubar -configuration Debug \
            -destination 'platform=macOS' -derivedDataPath "$RUNNER_TEMP/DerivedData-test" \
            CODE_SIGNING_ALLOWED=NO test

      - name: Prepare Apple signing credentials
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          set -euo pipefail

          for name in \
            APPLE_CERTIFICATE \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_API_KEY_BASE64 \
            APPLE_API_KEY \
            APPLE_API_ISSUER; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing release environment value: $name" >&2
              exit 1
            fi
          done

          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"

          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$APPLE_CERTIFICATE_PATH"
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$APPLE_API_KEY_PATH"
          chmod 600 "$APPLE_CERTIFICATE_PATH" "$APPLE_API_KEY_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$BUILD_KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$BUILD_KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$BUILD_KEYCHAIN_PATH"
          security import "$APPLE_CERTIFICATE_PATH" \
            -k "$BUILD_KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$BUILD_KEYCHAIN_PATH"
          security list-keychains -d user -s \
            "$BUILD_KEYCHAIN_PATH" \
            "$HOME/Library/Keychains/login.keychain-db"
          security default-keychain -d user -s "$BUILD_KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$BUILD_KEYCHAIN_PATH" \
            | grep -F "$APPLE_SIGNING_IDENTITY"

      # The project stays ad-hoc signed so it builds without an Apple account;
      # Developer ID signing and the hardened runtime that notarization requires
      # are applied only here. Without disabling base entitlements, Xcode adds
      # get-task-allow and notarization rejects the app.
      - name: Build signed app
        run: |
          set -euo pipefail

          xcodebuild -project StrataMenubar.xcodeproj -scheme StrataMenubar -configuration Release \
            -destination 'platform=macOS,arch=arm64' -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            ARCHS=arm64 \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$APPLE_SIGNING_IDENTITY" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            ENABLE_HARDENED_RUNTIME=YES \
            CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO \
            OTHER_CODE_SIGN_FLAGS=--timestamp \
            build

          APP_PATH="$RUNNER_TEMP/DerivedData/Build/Products/Release/StrataMenubar.app"
          codesign --verify --strict --deep --verbose=2 "$APP_PATH"
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      - name: Build DMG
        run: |
          set -euo pipefail

          DMG_ROOT="$RUNNER_TEMP/dmg-root"
          DMG_PATH="$RUNNER_TEMP/StrataMenubar_${VERSION}_arm64.dmg"
          mkdir -p "$DMG_ROOT"
          ditto "$APP_PATH" "$DMG_ROOT/StrataMenubar.app"
          ln -s /Applications "$DMG_ROOT/Applications"
          hdiutil create -volname StrataMenubar -srcfolder "$DMG_ROOT" -fs HFS+ -format UDZO "$DMG_PATH"
          codesign --sign "$APPLE_SIGNING_IDENTITY" --timestamp "$DMG_PATH"

          echo "DMG_PATH=$DMG_PATH" >> "$GITHUB_ENV"

      - name: Notarize and verify DMG
        run: |
          set -euo pipefail

          xcrun notarytool submit "$DMG_PATH" \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          xcrun stapler staple "$DMG_PATH"
          xcrun stapler validate "$DMG_PATH"
          spctl --assess \
            --type open \
            --context context:primary-signature \
            --verbose=4 \
            "$DMG_PATH"

          DMG_NAME="$(basename "$DMG_PATH")"
          CHECKSUM_PATH="$DMG_PATH.sha256"
          (
            cd "$(dirname "$DMG_PATH")"
            shasum -a 256 "$DMG_NAME" > "$(basename "$CHECKSUM_PATH")"
          )

          echo "CHECKSUM_PATH=$CHECKSUM_PATH" >> "$GITHUB_ENV"

      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if IS_DRAFT="$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [[ "$IS_DRAFT" != "true" ]]; then
              echo "Release $GITHUB_REF_NAME is already published; refusing to replace assets." >&2
              exit 1
            fi
            gh release upload "$GITHUB_REF_NAME" "$DMG_PATH" "$CHECKSUM_PATH" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$DMG_PATH" "$CHECKSUM_PATH" \
              --draft \
              --generate-notes \
              --title "StrataMenubar $GITHUB_REF_NAME" \
              --verify-tag
          fi

      - name: Remove temporary signing credentials
        if: ${{ always() }}
        run: |
          set +e
          security default-keychain -d user -s "$HOME/Library/Keychains/login.keychain-db"
          security delete-keychain "$BUILD_KEYCHAIN_PATH"
          rm -f \
            "$APPLE_CERTIFICATE_PATH" \
            "$RUNNER_TEMP"/AuthKey_*.p8
